name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SerialMonitor.WinUI\SerialMonitor.WinUI.sln
      - run: dotnet build SerialMonitor.WinUI\SerialMonitor.WinUI.sln --configuration ${{ matrix.configuration }} --no-restore
      # Keep process-heavy Core stress tests from starving WinUI timing checks
      # on the hosted worker. Individual tests retain their concurrency coverage.
      - run: dotnet test SerialMonitor.WinUI\SerialMonitor.WinUI.sln --configuration ${{ matrix.configuration }} --no-build --no-restore -m:1
      - name: Test retained log navigation and activity histogram
        run: node scripts/test_log_navigation.cjs
      - name: Test terminal navigation anchors and resize during RX
        run: node --test scripts/test_log_navigation_terminal.cjs
      - name: Check compact navigation dialog layout and removed tab
        run: node --test scripts/test_navigation_dialog_structure.cjs
      - name: Check history metadata retention and resize allocations
        run: node --test --test-name-pattern=metadata scripts/test_xterm_history.mjs
      - name: Test standalone skill installation and custom paths
        if: matrix.configuration == 'Release'
        shell: powershell
        run: |
          .\scripts\test_agent_skill.ps1
          .\scripts\test_skill_paths.ps1
      - name: Validate plugin packages, shared skill and local MCP launch
        if: matrix.configuration == 'Release'
        shell: powershell
        run: .\scripts\test_agent_plugin.ps1 -CliPath .\SerialMonitor.Cli\bin\Release\net8.0\serialctl.exe
