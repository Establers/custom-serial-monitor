<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serial Monitor xterm Log View</title>
  <link rel="preload" href="./fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/JetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./xterm.css">
  <style>
    @font-face {
      font-family: "JetBrains Mono Bundled";
      src: url("./fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: block;
    }

    @font-face {
      font-family: "JetBrains Mono Bundled";
      src: url("./fonts/JetBrainsMono-Bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: block;
    }

    :root {
      color-scheme: dark light;
      --page-background: #0c0d0e;
      --page-foreground: #d6d6d6;
      --selection-background: #375a7f;
      --selection-foreground: #ffffff;
      --scrollbar-thumb: #3a3a3a;
      --overlay-foreground: #f2f2f2;
      --overlay-detail: #c8cdd2;
      --card-background: #16181a;
      --card-border: #3a3d42;
      --menu-background: #18191a;
      --menu-hover: #2d2f31;
      --menu-disabled: #6b6d70;
      --menu-separator: #303234;
      --menu-shadow: rgba(0, 0, 0, 0.45);
      --selection-hint-background: #25282c;
      --selection-hint-foreground: #f3f3f3;
      --selection-hint-border: #555a61;
      --selection-hint-shadow: rgba(0, 0, 0, 0.35);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --page-background: #ffffff;
        --page-foreground: #1b1b1b;
        --selection-background: #add6ff;
        --selection-foreground: #000000;
        --scrollbar-thumb: #a0a0a0;
        --overlay-foreground: #1b1b1b;
        --overlay-detail: #5d5d5d;
        --card-background: #ffffff;
        --card-border: #c7c7c7;
        --menu-background: #ffffff;
        --menu-hover: #e9e9e9;
        --menu-disabled: #8a8a8a;
        --menu-separator: #d6d6d6;
        --menu-shadow: rgba(0, 0, 0, 0.20);
        --selection-hint-background: #f7f7f7;
        --selection-hint-foreground: #1b1b1b;
        --selection-hint-border: #a8a8a8;
        --selection-hint-shadow: rgba(0, 0, 0, 0.18);
      }
    }

    @media (forced-colors: active) {
      :root {
        color-scheme: light dark;
        --page-background: Canvas;
        --page-foreground: CanvasText;
        --selection-background: Highlight;
        --selection-foreground: HighlightText;
        --scrollbar-thumb: ButtonText;
        --overlay-foreground: CanvasText;
        --overlay-detail: CanvasText;
        --card-background: Canvas;
        --card-border: CanvasText;
        --menu-background: Canvas;
        --menu-hover: Highlight;
        --menu-disabled: GrayText;
        --menu-separator: CanvasText;
        --menu-shadow: none;
        --selection-hint-background: Canvas;
        --selection-hint-foreground: CanvasText;
        --selection-hint-border: CanvasText;
        --selection-hint-shadow: none;
      }

      html,
      body,
      #terminal,
      .xterm,
      #restoreOverlay,
      #contextMenu,
      #contextMenu button,
      #hexSelectionHint {
        forced-color-adjust: none;
      }

      #contextMenu button:hover:not(:disabled) {
        color: HighlightText;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-background);
    }

    body {
      position: fixed;
      inset: 0;
    }

    #terminal {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--page-background);
    }

    .xterm {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
      background: var(--page-background);
    }

    .xterm .xterm-viewport {
      background-color: var(--page-background) !important;
      scrollbar-color: var(--scrollbar-thumb) var(--page-background);
      scrollbar-width: thin;
    }

    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 10px;
      height: 10px;
      background: var(--page-background);
    }

    .xterm .xterm-viewport::-webkit-scrollbar-track {
      background: var(--page-background);
    }

    .xterm .xterm-viewport::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border: 2px solid var(--page-background);
    }

    .xterm .xterm-viewport::-webkit-scrollbar-corner,
    ::-webkit-scrollbar-corner {
      background: var(--page-background);
    }

    #restoreOverlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--page-background);
      font-family: "Segoe UI", sans-serif;
      color: var(--overlay-foreground);
    }

    #restoreOverlay.visible {
      display: flex;
    }

    #restoreOverlay .restore-card {
      display: flex;
      max-width: 280px;
      padding: 14px 18px;
      border: 1px solid var(--card-border);
      background: var(--card-background);
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #restoreOverlay img {
      width: 150px;
      height: 140px;
      object-fit: contain;
    }

    #restoreOverlayTitle {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    #restoreOverlayDetail {
      color: var(--overlay-detail);
      font-size: 11px;
      text-align: center;
    }

    #contextMenu {
      position: fixed;
      z-index: 10000;
      display: none;
      min-width: 154px;
      padding: 3px;
      border: 1px solid var(--card-border);
      background: var(--menu-background);
      box-shadow: 0 4px 16px var(--menu-shadow);
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      color: var(--page-foreground);
      user-select: none;
    }

    #contextMenu button {
      display: block;
      width: 100%;
      height: 24px;
      margin: 0;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--page-foreground);
      font: inherit;
      text-align: left;
    }

    #contextMenu button:hover:not(:disabled) {
      background: var(--menu-hover);
    }

    #contextMenu button:disabled {
      color: var(--menu-disabled);
    }

    #contextMenu .separator {
      height: 1px;
      margin: 3px 4px;
      background: var(--menu-separator);
    }

    #hexSelectionHint {
      position: fixed;
      z-index: 15000;
      display: none;
      padding: 3px 7px;
      border: 1px solid var(--selection-hint-border);
      border-radius: 3px;
      background: var(--selection-hint-background);
      box-shadow: 0 2px 8px var(--selection-hint-shadow);
      color: var(--selection-hint-foreground);
      font-family: "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <div id="restoreOverlay" aria-hidden="true">
    <div class="restore-card">
      <img src="https://serialmonitor-loading.local/log_restore.png" alt="">
      <div id="restoreOverlayTitle">로그 화면 복원 중...</div>
      <div id="restoreOverlayDetail">Preparing log view</div>
    </div>
  </div>
  <div id="contextMenu" role="menu" aria-hidden="true">
    <button type="button" data-action="copy" data-requires-selection="true">Copy</button>
    <button type="button" data-action="copyAllVisible">Copy all visible</button>
    <button type="button" data-action="copySinceLastTx" title="Copy visible log region starting at the most recent TX">Copy since last TX</button>
    <button type="button" data-action="copySinceLastMark" title="Copy visible log region starting at the most recent MARK">Copy since last MARK</button>
    <div class="separator"></div>
    <button type="button" data-action="clear">Clear screen</button>
    <button type="button" data-action="quickMarker">Quick marker</button>
    <button type="button" data-action="searchSelected" data-requires-selection="true">Search selected text</button>
  </div>
  <div id="hexSelectionHint" aria-hidden="true"></div>
  <script src="./xterm.js"></script>
  <script src="./xterm-addon-fit.js"></script>
  <script src="./xterm-addon-search.js"></script>
  <script>
    const darkTerminalTheme = {
      background: '#0c0d0e',
      foreground: '#d6d6d6',
      selectionBackground: '#375a7f',
      selectionForeground: '#ffffff',
      cursor: '#d6d6d6',
      black: '#0c0d0e',
      red: '#d9534f',
      green: '#5cb85c',
      yellow: '#f0ad4e',
      blue: '#5bc0de',
      magenta: '#b066d8',
      cyan: '#5bc0de',
      white: '#d6d6d6',
      brightBlack: '#6b6d70',
      brightRed: '#ff7b72',
      brightGreen: '#8bc34a',
      brightYellow: '#ffd166',
      brightBlue: '#8eb8ff',
      brightMagenta: '#d58cff',
      brightCyan: '#7fdbff',
      brightWhite: '#ffffff',
      // Index 16 is automatic text for highlighted backgrounds; 17-26 are
      // Red, Orange, Green, Yellow, Blue, Magenta, Cyan, White, Gray, Black backgrounds.
      extendedAnsi: [
        '#0c0d0e',
        '#d9534f',
        '#d16a00',
        '#5cb85c',
        '#f0ad4e',
        '#5bc0de',
        '#b066d8',
        '#5bc0de',
        '#d6d6d6',
        '#808080',
        '#7a7a7a'
      ]
    };

    const lightTerminalTheme = {
      background: '#ffffff',
      foreground: '#1b1b1b',
      selectionBackground: '#add6ff',
      selectionForeground: '#000000',
      cursor: '#1b1b1b',
      black: '#1b1b1b',
      red: '#c50f1f',
      green: '#107c10',
      yellow: '#765b00',
      blue: '#005a9e',
      magenta: '#7a1f7a',
      cyan: '#00666f',
      white: '#595959',
      brightBlack: '#686868',
      brightRed: '#a4262c',
      brightGreen: '#0f6b2d',
      brightYellow: '#6f5500',
      brightBlue: '#004e8c',
      brightMagenta: '#702070',
      brightCyan: '#005e66',
      brightWhite: '#242424',
      // Keep foreground and background palettes independent in the light theme.
      extendedAnsi: [
        '#ffffff',
        '#c50f1f',
        '#9a4b00',
        '#107c10',
        '#765b00',
        '#005a9e',
        '#7a1f7a',
        '#00666f',
        '#595959',
        '#686868',
        '#1b1b1b'
      ]
    };

    const colorSchemeQuery = window.matchMedia('(prefers-color-scheme: light)');
    const forcedColorsQuery = window.matchMedia('(forced-colors: active)');

    const resolveSystemColor = systemColor => {
      const probe = document.createElement('span');
      probe.style.color = systemColor;
      probe.style.position = 'fixed';
      probe.style.visibility = 'hidden';
      document.body.appendChild(probe);
      const resolved = window.getComputedStyle(probe).color;
      probe.remove();
      return resolved;
    };

    const getHighContrastTerminalTheme = () => {
      const background = resolveSystemColor('Canvas');
      const foreground = resolveSystemColor('CanvasText');
      const selectionBackground = resolveSystemColor('Highlight');
      const selectionForeground = resolveSystemColor('HighlightText');

      return {
        background,
        foreground,
        selectionBackground,
        selectionForeground,
        cursor: foreground,
        black: foreground,
        red: foreground,
        green: foreground,
        yellow: foreground,
        blue: foreground,
        magenta: foreground,
        cyan: foreground,
        white: foreground,
        brightBlack: foreground,
        brightRed: foreground,
        brightGreen: foreground,
        brightYellow: foreground,
        brightBlue: foreground,
        brightMagenta: foreground,
        brightCyan: foreground,
        brightWhite: foreground,
        // Use the user's selected-text pair for every highlighted background.
        extendedAnsi: [
          selectionForeground,
          selectionBackground,
          selectionBackground,
          selectionBackground,
          selectionBackground,
          selectionBackground,
          selectionBackground,
          selectionBackground,
          selectionBackground,
          selectionBackground,
          selectionBackground
        ]
      };
    };

    const getTerminalTheme = () => {
      if (forcedColorsQuery.matches) {
        return getHighContrastTerminalTheme();
      }

      return colorSchemeQuery.matches ? lightTerminalTheme : darkTerminalTheme;
    };

    const bundledTerminalFontFamily = '"JetBrains Mono Bundled", Consolas, "Cascadia Mono", Menlo, monospace';
    const fallbackTerminalFontFamily = 'Consolas, "Cascadia Mono", Menlo, monospace';
    let configuredTerminalFontFamily = fallbackTerminalFontFamily;
    let bundledTerminalFontReady = false;
    const terminal = new Terminal({
      allowTransparency: false,
      convertEol: true,
      cursorBlink: false,
      disableStdin: true,
      fontFamily: fallbackTerminalFontFamily,
      fontSize: 13,
      fontWeight: 400,
      fontWeightBold: 700,
      minimumContrastRatio: 4.5,
      scrollback: 50000,
      theme: getTerminalTheme()
    });

    const fitAddon = new FitAddon.FitAddon();
    const searchAddon = new SearchAddon.SearchAddon();
    terminal.loadAddon(fitAddon);
    terminal.loadAddon(searchAddon);
    terminal.open(document.getElementById('terminal'));
    fitAddon.fit();

    const applyBundledTerminalFont = async () => {
      try {
        await Promise.all([
          document.fonts.load('400 12px "JetBrains Mono Bundled"'),
          document.fonts.load('700 12px "JetBrains Mono Bundled"')
        ]);

        const regularLoaded = document.fonts.check('400 12px "JetBrains Mono Bundled"');
        const boldLoaded = document.fonts.check('700 12px "JetBrains Mono Bundled"');
        if (!regularLoaded || !boldLoaded) {
          throw new Error(`font availability check failed (regular=${regularLoaded}, bold=${boldLoaded})`);
        }

        bundledTerminalFontReady = true;
        if (configuredTerminalFontFamily.includes('"JetBrains Mono Bundled"')) {
          terminal.options.fontFamily = configuredTerminalFontFamily;
          terminal.clearTextureAtlas();
          fitAddon.fit();
          terminal.refresh(0, Math.max(0, terminal.rows - 1));
        }
      } catch (error) {
        console.error('Bundled JetBrains Mono load failed; using the system monospace fallback.', error);
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({
            type: 'xtermFontLoadFailed',
            error: String(error)
          });
        }
      }
    };

    void applyBundledTerminalFont();

    const applyColorScheme = () => {
      terminal.options.theme = getTerminalTheme();
      terminal.refresh(0, Math.max(0, terminal.rows - 1));
    };

    const observeColorScheme = mediaQuery => {
      if (typeof mediaQuery.addEventListener === 'function') {
        mediaQuery.addEventListener('change', applyColorScheme);
      } else if (typeof mediaQuery.addListener === 'function') {
        mediaQuery.addListener(applyColorScheme);
      }
    };

    observeColorScheme(colorSchemeQuery);
    observeColorScheme(forcedColorsQuery);

    const appendQueue = [];
    const replaceQueue = [];
    const parsedLogLineIds = [];
    let appendQueueHead = 0;
    let replaceQueueHead = 0;
    let parsedLogLineIdHead = 0;
    let appendDrainScheduled = false;
    let appendWriting = false;
    let replaceWriting = false;
    let contextMenuSelection = '';
    let hexSelectionHintEnabled = false;
    let pointerSelectionGesture = false;
    let selectionPointerX = 0;
    let selectionPointerY = 0;
    let hexSelectionHintIdentity = '';
    let hexSelectionHintUpdateFrame = 0;
    let forcePendingHexSelectionHintUpdate = false;
    const maxLiveHexSelectionRows = 2000;
    const contextMenu = document.getElementById('contextMenu');
    const terminalElement = document.getElementById('terminal');
    const hexSelectionHint = document.getElementById('hexSelectionHint');
    const restoreOverlay = document.getElementById('restoreOverlay');
    const restoreOverlayTitle = document.getElementById('restoreOverlayTitle');
    const restoreOverlayDetail = document.getElementById('restoreOverlayDetail');

    function resetParsedLogLineIds() {
      parsedLogLineIds.length = 0;
      parsedLogLineIdHead = 0;
    }

    function trimParsedLogLineIds() {
      const maxRetainedIds = Math.max(1, Number(terminal.options.scrollback || 0) + terminal.rows + 1);
      if (parsedLogLineIds.length - parsedLogLineIdHead > maxRetainedIds) {
        parsedLogLineIdHead = parsedLogLineIds.length - maxRetainedIds;
      }

      if (parsedLogLineIdHead > 4096 && parsedLogLineIdHead * 2 > parsedLogLineIds.length) {
        parsedLogLineIds.splice(0, parsedLogLineIdHead);
        parsedLogLineIdHead = 0;
      }
    }

    function getParsedLogLineIdsSnapshot() {
      trimParsedLogLineIds();
      return parsedLogLineIds.slice(parsedLogLineIdHead);
    }

    terminal.parser.registerOscHandler(777, data => {
      const lineId = String(data ?? '').trim();
      if (!/^\d+$/.test(lineId)) {
        return false;
      }

      parsedLogLineIds.push(lineId);
      trimParsedLogLineIds();
      return true;
    });

    function normalizeLogText(text) {
      return String(text ?? '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\n/g, '\r\n');
    }

    function queueAppendDrain() {
      if (appendDrainScheduled || appendWriting || replaceWriting) {
        return;
      }

      appendDrainScheduled = true;
      window.requestAnimationFrame(drainAppendQueue);
    }

    function appendQueueLength() {
      return appendQueue.length - appendQueueHead;
    }

    function compactAppendQueueIfNeeded() {
      if (appendQueueHead > 1024 && appendQueueHead * 2 > appendQueue.length) {
        appendQueue.splice(0, appendQueueHead);
        appendQueueHead = 0;
      }
    }

    function postAppendResult(item, success, error) {
      if (!item || !Number.isFinite(Number(item.requestId)) || Number(item.requestId) <= 0) {
        return;
      }

      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({
          type: 'xtermAppendCompleted',
          requestId: Number(item.requestId),
          success: !!success,
          error: error ? String(error) : ''
        });
      }
    }

    function drainAppendQueue() {
      appendDrainScheduled = false;
      if (appendWriting || replaceWriting || appendQueueLength() === 0) {
        return;
      }

      const item = appendQueue[appendQueueHead++];
      compactAppendQueueIfNeeded();
      appendWriting = true;
      try {
        terminal.write(item.text, () => {
          if (item.autoScroll && appendQueueLength() === 0) {
            terminal.scrollToBottom();
          }
          postAppendResult(item, true, '');
          appendWriting = false;
          if (appendQueueLength() > 0) {
            queueAppendDrain();
          }
        });
      } catch (error) {
        appendWriting = false;
        postAppendResult(item, false, error);
        console.error('xterm append failed', error);
        if (appendQueueLength() > 0) {
          queueAppendDrain();
        }
      }
    }

    function finishReplace(autoScroll) {
      replaceQueue.length = 0;
      replaceQueueHead = 0;
      replaceWriting = false;
      if (autoScroll) {
        terminal.scrollToBottom();
      }
      queueAppendDrain();
    }

    function commitReplaceQueue(autoScroll) {
      if (replaceQueueHead >= replaceQueue.length) {
        finishReplace(autoScroll);
        return;
      }

      try {
        // Full restores are already covered by the native loading overlay. Avoid
        // both the normal frame pacing and a callback gap between transport
        // chunks. xterm keeps write ordering and invokes the last callback only
        // after every previously queued chunk has been parsed.
        const lastIndex = replaceQueue.length - 1;
        for (let index = replaceQueueHead; index <= lastIndex; index += 1) {
          terminal.write(
            replaceQueue[index],
            index === lastIndex ? () => finishReplace(autoScroll) : undefined);
        }
        replaceQueueHead = replaceQueue.length;
      } catch (error) {
        replaceWriting = false;
        replaceQueue.length = 0;
        replaceQueueHead = 0;
        console.error('xterm bulk replace failed', error);
        queueAppendDrain();
      }
    }

    function isAtBottom() {
      const buffer = terminal.buffer && terminal.buffer.active;
      if (!buffer) {
        return true;
      }

      return buffer.viewportY >= buffer.baseY;
    }

    function getScrollState() {
      const buffer = terminal.buffer && terminal.buffer.active;
      if (!buffer) {
        return {
          ok: false,
          viewportY: 0,
          baseY: 0,
          rows: 0,
          atBottom: true
        };
      }

      return {
        ok: true,
        viewportY: buffer.viewportY,
        baseY: buffer.baseY,
        rows: terminal.rows,
        atBottom: isAtBottom()
      };
    }

    function restoreScrollState(state) {
      const buffer = terminal.buffer && terminal.buffer.active;
      if (!buffer || !state || !Number.isFinite(Number(state.viewportY))) {
        return false;
      }

      const target = Math.max(0, Math.min(buffer.baseY, Math.floor(Number(state.viewportY))));
      if (typeof terminal.scrollToLine === 'function') {
        terminal.scrollToLine(target);
      } else if (typeof terminal.scrollLines === 'function') {
        terminal.scrollLines(target - buffer.viewportY);
      } else {
        return false;
      }
      return true;
    }

    function copySelectedText(source) {
      const selectedText = terminal.getSelection();
      if (!selectedText) {
        return false;
      }

      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'copySelection', text: selectedText, source });
        return true;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(selectedText).catch(() => {});
        return true;
      }

      return false;
    }

    function buildCommandShortcut(event) {
      if (event.shiftKey) {
        return null;
      }

      const key = String(event.key || '').toUpperCase();
      if (event.ctrlKey && !event.altKey && /^[0-9]$/.test(key)) {
        return `Ctrl+${key}`;
      }

      if (event.altKey && !event.ctrlKey && /^[A-Z0-9]$/.test(key)) {
        return `Alt+${key}`;
      }

      return null;
    }

    function postCommandShortcut(event, source) {
      const shortcut = buildCommandShortcut(event);
      if (!shortcut || !window.chrome || !window.chrome.webview) {
        return false;
      }

      window.chrome.webview.postMessage({ type: 'shortcut', shortcut, source });
      event.preventDefault();
      event.stopPropagation();
      return true;
    }

    function postMarkerShortcut(event, source) {
      const key = String(event.key || '').toLowerCase();
      if (!event.ctrlKey || event.altKey || event.shiftKey || key !== 'm' ||
          !window.chrome || !window.chrome.webview) {
        return false;
      }

      window.chrome.webview.postMessage({ type: 'markerShortcut', source });
      event.preventDefault();
      event.stopPropagation();
      return true;
    }

    function postSearchShortcut(event, source) {
      if (!window.chrome || !window.chrome.webview) {
        return false;
      }

      const key = String(event.key || '');
      const lowerKey = key.toLowerCase();
      let action = null;

      if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && lowerKey === 'f') {
        action = 'focus';
      } else if (!event.ctrlKey && !event.metaKey && !event.altKey && key === 'F3') {
        action = event.shiftKey ? 'previous' : 'next';
      }

      if (!action) {
        return false;
      }

      window.chrome.webview.postMessage({ type: 'searchShortcut', action, source });
      event.preventDefault();
      event.stopPropagation();
      return true;
    }

    function postAutoScrollToggleShortcut(event, source) {
      if (event.key !== 'Enter' || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey ||
          !window.chrome || !window.chrome.webview) {
        return false;
      }

      const terminalElement = document.getElementById('terminal');
      if (!terminalElement || !terminalElement.contains(event.target)) {
        return false;
      }

      // Consume key-repeat events so holding Enter cannot rapidly flip the setting.
      if (!event.repeat) {
        window.chrome.webview.postMessage({ type: 'toggleAutoScroll', source });
      }

      event.preventDefault();
      event.stopPropagation();
      return true;
    }

    function postContextMenuAction(action) {
      if (!window.chrome || !window.chrome.webview) {
        return;
      }

      window.chrome.webview.postMessage({
        type: 'contextMenuAction',
        action,
        selectedText: contextMenuSelection,
        source: 'xterm-context-menu'
      });
    }

    function hideContextMenu() {
      contextMenu.style.display = 'none';
      contextMenu.setAttribute('aria-hidden', 'true');
    }

    function hideHexSelectionHint() {
      cancelQueuedHexSelectionHintUpdate();
      hexSelectionHint.style.display = 'none';
      hexSelectionHint.setAttribute('aria-hidden', 'true');
    }

    function cancelQueuedHexSelectionHintUpdate() {
      if (hexSelectionHintUpdateFrame) {
        window.cancelAnimationFrame(hexSelectionHintUpdateFrame);
        hexSelectionHintUpdateFrame = 0;
      }
      forcePendingHexSelectionHintUpdate = false;
    }

    function getHexSelectionIdentity(position) {
      return position ? JSON.stringify(position) : '';
    }

    function countHexBytesInSelectedLine(selectedLine) {
      let byteCount = 0;
      let candidate = selectedLine;
      // The selection can start in the middle of a timestamp. In that case
      // the remaining "] RX <" / "] TX >" marker still identifies payload.
      const packetMetadata = /(?:^|]\s*)(?:RX\s*<|TX\s*>)(?:\s|$)/i.exec(candidate);
      if (packetMetadata) {
        candidate = candidate.slice(packetMetadata.index + packetMetadata[0].length);
      } else {
        // A drag can begin inside the short RX/TX prefix rather than at the
        // start of the row (for example "X < AA 55").
        candidate = candidate.replace(
          /^\s*(?:(?:R?X\s*)?<|(?:T?X\s*)?>)\s*/i,
          '');

        // Without a full log prefix, accept only a plain HEX fragment. This
        // prevents standalone numbers in SYS or Terminal text from counting.
        if (!/^\s*(?:[0-9a-f]{0,2}\s+)*[0-9a-f]{0,2}\s*$/i.test(candidate)) {
          return 0;
        }
      }

      const bytePattern = /(?:^|\s)[0-9a-f]{2}(?=\s|$)/gi;
      while (bytePattern.exec(candidate)) {
        byteCount++;
      }

      return byteCount;
    }

    function countHexBytesInSelection(selectedText) {
      const text = String(selectedText || '');
      let byteCount = 0;
      let lineStart = 0;
      while (lineStart <= text.length) {
        let lineEnd = lineStart;
        while (lineEnd < text.length && text.charCodeAt(lineEnd) !== 10 && text.charCodeAt(lineEnd) !== 13) {
          lineEnd++;
        }

        byteCount += countHexBytesInSelectedLine(text.slice(lineStart, lineEnd));
        if (lineEnd >= text.length) {
          break;
        }

        if (text.charCodeAt(lineEnd) === 13 && text.charCodeAt(lineEnd + 1) === 10) {
          lineEnd++;
        }
        lineStart = lineEnd + 1;
      }

      return byteCount;
    }

    function positionHexSelectionHint() {
      const margin = 6;
      const offsetX = 12;
      const offsetY = 16;
      const width = hexSelectionHint.offsetWidth;
      const height = hexSelectionHint.offsetHeight;
      let left = selectionPointerX + offsetX;
      let top = selectionPointerY + offsetY;

      if (left + width > window.innerWidth - margin) {
        left = selectionPointerX - width - offsetX;
      }
      if (top + height > window.innerHeight - margin) {
        top = selectionPointerY - height - offsetY;
      }

      hexSelectionHint.style.left = `${Math.max(margin, Math.min(left, window.innerWidth - width - margin))}px`;
      hexSelectionHint.style.top = `${Math.max(margin, Math.min(top, window.innerHeight - height - margin))}px`;
    }

    function showHexSelectionHint(text) {
      hexSelectionHint.textContent = text;
      hexSelectionHint.style.display = 'block';
      hexSelectionHint.setAttribute('aria-hidden', 'false');
      positionHexSelectionHint();
    }

    function updateHexSelectionHint(forceUpdate) {
      if (!hexSelectionHintEnabled || (!pointerSelectionGesture && !forceUpdate)) {
        return;
      }

      const selectionPosition = terminal.getSelectionPosition();
      hexSelectionHintIdentity = getHexSelectionIdentity(selectionPosition);
      if (!selectionPosition) {
        hideHexSelectionHint();
        return;
      }

      const selectedRowCount = Math.abs(selectionPosition.end.y - selectionPosition.start.y) + 1;
      if (!forceUpdate && selectedRowCount > maxLiveHexSelectionRows) {
        showHexSelectionHint('Len : …');
        return;
      }

      // getSelection can allocate a very large string. Call it only once for
      // the coalesced frame, and only after the live-size guard above.
      const selectedText = terminal.getSelection();
      const byteCount = countHexBytesInSelection(selectedText);
      if (byteCount <= 0) {
        hideHexSelectionHint();
        return;
      }

      showHexSelectionHint(`Len : ${byteCount}`);
    }

    function queueHexSelectionHintUpdate(forceUpdate = false) {
      if (!hexSelectionHintEnabled || (!pointerSelectionGesture && !forceUpdate)) {
        return;
      }

      forcePendingHexSelectionHintUpdate ||= forceUpdate;
      if (hexSelectionHintUpdateFrame) {
        return;
      }

      hexSelectionHintUpdateFrame = window.requestAnimationFrame(() => {
        hexSelectionHintUpdateFrame = 0;
        const shouldForce = forcePendingHexSelectionHintUpdate;
        forcePendingHexSelectionHintUpdate = false;
        updateHexSelectionHint(shouldForce);
      });
    }

    function showContextMenu(event) {
      event.preventDefault();
      event.stopPropagation();
      hideHexSelectionHint();

      contextMenuSelection = terminal.getSelection() || '';
      const hasSelection = contextMenuSelection.length > 0;
      for (const button of contextMenu.querySelectorAll('button[data-requires-selection="true"]')) {
        button.disabled = !hasSelection;
      }

      contextMenu.style.display = 'block';
      contextMenu.setAttribute('aria-hidden', 'false');

      const width = contextMenu.offsetWidth;
      const height = contextMenu.offsetHeight;
      const left = Math.min(event.clientX, Math.max(0, window.innerWidth - width - 2));
      const top = Math.min(event.clientY, Math.max(0, window.innerHeight - height - 2));
      contextMenu.style.left = `${Math.max(0, left)}px`;
      contextMenu.style.top = `${Math.max(0, top)}px`;
    }

    window.serialMonitorAppendLog = function (text, autoScroll, requestId) {
      const normalized = normalizeLogText(text);
      if (!normalized) {
        postAppendResult({ requestId }, true, '');
        return true;
      }

      // C# already coalesces and bounds live batches. Keep one acknowledgement
      // boundary per host batch so completion means xterm parsed all its text.
      appendQueue.push({ text: normalized, autoScroll: !!autoScroll, requestId });

      queueAppendDrain();

      return true;
    };

    window.serialMonitorBeginReplaceLog = function () {
      hideHexSelectionHint();
      pointerSelectionGesture = false;
      appendQueue.length = 0;
      appendQueueHead = 0;
      replaceQueue.length = 0;
      replaceQueueHead = 0;
      replaceWriting = false;
      resetParsedLogLineIds();
      terminal.clear();
      return true;
    };

    window.serialMonitorQueueReplaceChunk = function (text) {
      const normalized = normalizeLogText(text);
      if (normalized) {
        replaceQueue.push(normalized);
      }

      return true;
    };

    window.serialMonitorCommitReplaceLog = function (autoScroll) {
      if (replaceWriting) {
        return false;
      }

      replaceWriting = true;
      commitReplaceQueue(!!autoScroll);
      return true;
    };

    window.serialMonitorScrollToBottom = function () {
      terminal.scrollToBottom();
      return isAtBottom();
    };

    window.serialMonitorIsAtBottom = function () {
      return isAtBottom();
    };

    window.serialMonitorGetScrollState = function () {
      return getScrollState();
    };

    window.serialMonitorRestoreScrollState = function (state) {
      return restoreScrollState(state);
    };

    window.serialMonitorGetAppendQueueState = function () {
      return {
        queueLength: appendQueueLength() + replaceQueue.length - replaceQueueHead,
        writing: appendWriting || replaceWriting
      };
    };

    window.serialMonitorShowRestoreOverlay = function (title, detail) {
      restoreOverlayTitle.textContent = String(title || '로그 화면 복원 중...');
      restoreOverlayDetail.textContent = String(detail || 'Preparing log view');
      restoreOverlay.classList.add('visible');
      restoreOverlay.setAttribute('aria-hidden', 'false');
      return true;
    };

    window.serialMonitorHideRestoreOverlay = function () {
      restoreOverlay.classList.remove('visible');
      restoreOverlay.setAttribute('aria-hidden', 'true');
      return true;
    };

    window.serialMonitorClear = function () {
      hideHexSelectionHint();
      pointerSelectionGesture = false;
      appendQueue.length = 0;
      appendQueueHead = 0;
      replaceQueue.length = 0;
      replaceQueueHead = 0;
      replaceWriting = false;
      resetParsedLogLineIds();
      terminal.clear();
      return true;
    };

    window.serialMonitorSetScrollback = function (size) {
      const parsedSize = Number(size);
      if (!Number.isFinite(parsedSize) || parsedSize < 1000) {
        return false;
      }

      terminal.options.scrollback = Math.min(500000, Math.floor(parsedSize));
      trimParsedLogLineIds();
      return true;
    };

    window.serialMonitorSetFont = function (fontFamily, fontSize) {
      const normalizedFontFamily = String(fontFamily || '').trim();
      const parsedFontSize = Number(fontSize);
      if (!normalizedFontFamily ||
          !Number.isInteger(parsedFontSize) ||
          parsedFontSize < 10 ||
          parsedFontSize > 15) {
        return false;
      }

      configuredTerminalFontFamily = normalizedFontFamily;
      const useBundledFont = normalizedFontFamily.includes('"JetBrains Mono Bundled"');
      terminal.options.fontFamily = useBundledFont && !bundledTerminalFontReady
        ? fallbackTerminalFontFamily
        : normalizedFontFamily;
      terminal.options.fontSize = parsedFontSize;
      terminal.clearTextureAtlas();
      fitAddon.fit();
      terminal.refresh(0, Math.max(0, terminal.rows - 1));
      return true;
    };

    window.serialMonitorSetHexSelectionHintEnabled = function (enabled) {
      hexSelectionHintEnabled = !!enabled;
      if (!hexSelectionHintEnabled) {
        pointerSelectionGesture = false;
        hideHexSelectionHint();
      }

      return true;
    };

    window.serialMonitorGetScrollback = function () {
      return Number(terminal.options.scrollback || 0);
    };

    window.serialMonitorFit = function () {
      try {
        fitAddon.fit();
      } catch (error) {
        console.error('xterm fit failed', error);
      }

      return true;
    };

    let payloadSearchStateKey = '';
    let payloadSearchStateIndex = -1;

    function getPayloadStart(text) {
      const metadata = /^(?:\[[^\]\r\n]*\]\s+)?(?:RX <|TX >|MARK >|SYS)(?: |$)/.exec(text);
      return metadata ? metadata[0].length : -1;
    }

    function collectPayloadSearchMatches(searchText, caseSensitive) {
      const matches = [];
      const buffer = terminal.buffer.active;
      const needle = caseSensitive ? searchText : searchText.toLocaleLowerCase();
      let applicationLineCount = 0;

      for (let row = 0; row < buffer.length;) {
        const firstLine = buffer.getLine(row);
        if (!firstLine) {
          row++;
          continue;
        }

        // A wrapped row at the beginning of scrollback may have lost its logical
        // first row. It cannot be mapped reliably to a retained application line.
        if (firstLine.isWrapped) {
          row++;
          continue;
        }

        const rows = [];
        const stringStarts = [];
        let logicalText = '';
        do {
          const line = buffer.getLine(row);
          if (!line) {
            break;
          }

          rows.push(row);
          stringStarts.push(logicalText.length);
          const nextLine = buffer.getLine(row + 1);
          const continues = !!nextLine && nextLine.isWrapped;
          logicalText += line.translateToString(!continues);
          row++;
          if (!continues) {
            break;
          }
        } while (row < buffer.length);

        const payloadStart = getPayloadStart(logicalText);
        if (payloadStart < 0) {
          continue;
        }

        const applicationLineIndex = applicationLineCount++;
        const haystack = caseSensitive ? logicalText : logicalText.toLocaleLowerCase();
        const matchOffset = haystack.indexOf(needle, payloadStart);
        if (matchOffset >= payloadStart) {
          matches.push({
            applicationLineIndex,
            rows,
            stringStarts,
            startOffset: matchOffset,
            endOffset: matchOffset + searchText.length
          });
        }
      }

      const retainedLineIds = getParsedLogLineIdsSnapshot();
      const retainedIdStart = retainedLineIds.length - applicationLineCount;
      for (const match of matches) {
        const retainedIdIndex = retainedIdStart + match.applicationLineIndex;
        match.lineId = retainedIdIndex >= 0 && retainedIdIndex < retainedLineIds.length
          ? retainedLineIds[retainedIdIndex]
          : '';
      }

      return matches;
    }

    function stringOffsetToBufferPosition(match, stringOffset) {
      let segmentIndex = match.stringStarts.length - 1;
      for (let i = 0; i < match.stringStarts.length - 1; i++) {
        if (stringOffset < match.stringStarts[i + 1]) {
          segmentIndex = i;
          break;
        }
      }

      const row = match.rows[segmentIndex];
      const line = terminal.buffer.active.getLine(row);
      const localOffset = Math.max(0, stringOffset - match.stringStarts[segmentIndex]);
      let consumed = 0;
      let col = 0;
      for (; line && col < terminal.cols; col++) {
        const cell = line.getCell(col);
        if (!cell || cell.getWidth() === 0) {
          continue;
        }

        if (consumed >= localOffset) {
          break;
        }

        const chars = cell.getChars();
        consumed += cell.getCode() === 0 ? 1 : Math.max(1, chars.length);
      }

      return { row, col: Math.min(col, terminal.cols) };
    }

    function selectPayloadSearchMatch(match) {
      const start = stringOffsetToBufferPosition(match, match.startOffset);
      const end = stringOffsetToBufferPosition(match, match.endOffset);
      const size = Math.max(1, ((end.row - start.row) * terminal.cols) + end.col - start.col);
      terminal.select(start.col, start.row, size);

      const viewportTop = terminal.buffer.active.viewportY;
      if (start.row < viewportTop || start.row >= viewportTop + terminal.rows) {
        terminal.scrollToLine(Math.max(0, start.row - Math.floor(terminal.rows / 2)));
      }
    }

    window.serialMonitorSearch = function (request) {
      try {
        const searchText = String(request?.text ?? '');
        if (!searchText) {
          terminal.clearSelection();
          searchAddon.clearDecorations();
          payloadSearchStateKey = '';
          payloadSearchStateIndex = -1;
          return { ok: true, found: false };
        }

        const caseSensitive = !!request?.caseSensitive;
        const matches = collectPayloadSearchMatches(searchText, caseSensitive);
        searchAddon.clearDecorations();
        if (Number.isInteger(request?.resultIndex) && request.resultIndex < 0) {
          terminal.clearSelection();
          payloadSearchStateIndex = -1;
          return { ok: true, found: false };
        }

        if (matches.length === 0) {
          terminal.clearSelection();
          payloadSearchStateIndex = -1;
          return { ok: true, found: false };
        }

        const targetLineId = String(request?.targetLineId ?? '');
        if (targetLineId) {
          const retainedResultIndex = matches.findIndex(match => match.lineId === targetLineId);
          if (retainedResultIndex < 0) {
            terminal.clearSelection();
            return { ok: true, found: false };
          }

          payloadSearchStateIndex = retainedResultIndex;
          payloadSearchStateKey = `${caseSensitive ? '1' : '0'}:${searchText}`;
          selectPayloadSearchMatch(matches[payloadSearchStateIndex]);
          return { ok: true, found: true };
        }

        if (Number.isInteger(request?.resultIndex) && request.resultIndex >= 0) {
          if (request.resultIndex >= matches.length) {
            terminal.clearSelection();
            return { ok: true, found: false };
          }

          payloadSearchStateIndex = request.resultIndex;
          payloadSearchStateKey = `${caseSensitive ? '1' : '0'}:${searchText}`;
          selectPayloadSearchMatch(matches[payloadSearchStateIndex]);
          return { ok: true, found: true };
        }

        const stateKey = `${caseSensitive ? '1' : '0'}:${searchText}`;
        if (payloadSearchStateKey !== stateKey) {
          payloadSearchStateKey = stateKey;
          payloadSearchStateIndex = request?.direction === 'previous' ? 0 : -1;
        }

        const direction = request?.direction === 'previous' ? 'previous' : 'next';
        payloadSearchStateIndex = direction === 'previous'
          ? (payloadSearchStateIndex - 1 + matches.length) % matches.length
          : (payloadSearchStateIndex + 1) % matches.length;
        selectPayloadSearchMatch(matches[payloadSearchStateIndex]);
        return { ok: true, found: true };
      } catch (error) {
        return {
          ok: false,
          found: false,
          error: error && error.message ? error.message : String(error)
        };
      }
    };

    let pendingFit = 0;
    function queueFit() {
      if (pendingFit) {
        window.clearTimeout(pendingFit);
      }

      pendingFit = window.setTimeout(() => {
        pendingFit = 0;
        window.serialMonitorFit();
      }, 25);
    }

    window.addEventListener('resize', queueFit);
    requestAnimationFrame(queueFit);

    terminal.attachCustomKeyEventHandler(event => {
      if (event.type !== 'keydown') {
        return true;
      }

      const isCopyShortcut = (event.ctrlKey || event.metaKey) &&
        !event.altKey &&
        event.key.toLowerCase() === 'c';
      if (isCopyShortcut) {
        if (!copySelectedText('xterm-key-handler')) {
          return true;
        }

        event.preventDefault();
        event.stopPropagation();
        return false;
      }

      if (postMarkerShortcut(event, 'xterm-key-handler')) {
        return false;
      }

      if (postSearchShortcut(event, 'xterm-key-handler')) {
        return false;
      }

      if (postCommandShortcut(event, 'xterm-key-handler')) {
          return false;
      }

      return true;
    });

    document.addEventListener('keydown', event => {
      if (postAutoScrollToggleShortcut(event, 'xterm-keydown')) {
        return;
      }

      const isCopyShortcut = (event.ctrlKey || event.metaKey) &&
        !event.altKey &&
        event.key.toLowerCase() === 'c';
      if (isCopyShortcut) {
        if (!copySelectedText('document-keydown')) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        return;
      }

      if (postMarkerShortcut(event, 'document-keydown')) {
        return;
      }

      if (postSearchShortcut(event, 'document-keydown')) {
        return;
      }

      if (postCommandShortcut(event, 'document-keydown')) {
        return;
      }
    }, true);

    document.addEventListener('contextmenu', showContextMenu, true);

    terminal.onSelectionChange(() => {
      if (pointerSelectionGesture) {
        queueHexSelectionHintUpdate();
      } else if (!forcePendingHexSelectionHintUpdate &&
                 getHexSelectionIdentity(terminal.getSelectionPosition()) !== hexSelectionHintIdentity) {
        hideHexSelectionHint();
      }
    });

    terminalElement.addEventListener('pointerdown', event => {
      if (event.button !== 0) {
        return;
      }

      pointerSelectionGesture = hexSelectionHintEnabled;
      selectionPointerX = event.clientX;
      selectionPointerY = event.clientY;
      hideHexSelectionHint();
    }, true);

    document.addEventListener('pointermove', event => {
      if (!pointerSelectionGesture) {
        return;
      }

      // If the button was released outside the WebView, its document may not
      // receive pointerup. The first move back inside reports no primary button.
      if ((event.buttons & 1) === 0) {
        pointerSelectionGesture = false;
        hideHexSelectionHint();
        return;
      }

      selectionPointerX = event.clientX;
      selectionPointerY = event.clientY;
      queueHexSelectionHintUpdate();
    }, true);

    document.addEventListener('pointerup', event => {
      if (!pointerSelectionGesture || event.button !== 0) {
        return;
      }

      selectionPointerX = event.clientX;
      selectionPointerY = event.clientY;
      window.setTimeout(() => {
        pointerSelectionGesture = false;
        queueHexSelectionHintUpdate(true);
      }, 0);
    }, true);

    document.addEventListener('pointercancel', () => {
      pointerSelectionGesture = false;
      hideHexSelectionHint();
    }, true);

    contextMenu.addEventListener('pointerdown', event => {
      event.stopPropagation();
    });

    contextMenu.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');
      if (!button || button.disabled) {
        return;
      }

      const action = button.getAttribute('data-action');
      hideContextMenu();
      postContextMenuAction(action);
    });

    document.addEventListener('pointerdown', event => {
      if (!contextMenu.contains(event.target)) {
        hideContextMenu();
      }
    }, true);

    document.addEventListener('scroll', () => {
      hideContextMenu();
      hideHexSelectionHint();
    }, true);
    window.addEventListener('blur', () => {
      hideContextMenu();
      hideHexSelectionHint();
      pointerSelectionGesture = false;
    });
    // TODO: Add optional "Save visible buffer to file" after a file-picker bridge is needed.
  </script>
</body>
</html>
